name: General bug report
description: Report a problem with the launcher, Steam login, or save synchronization.
title: "[BUG] "
labels: ["bug", "needs-triage", "category: reliability"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what went wrong and what you did just before it happened. You can report a problem even if you cannot collect logs.

        In the app, **Help → Report a bug on GitHub** fills in a log excerpt. You can also use **Help → Diagnostics → Create support report** and attach the report below. Review anything you share; remove passwords, Steam Guard codes, tokens, account details, and private saves.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include any error message shown on screen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: List the steps. If it happens only sometimes, say so.
      placeholder: |
        1. Open the launcher.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: environment
    attributes:
      label: Device and launcher version
      description: Give what you know. The version in the app or the release tag is enough; you do not need to find internal IDs.
      placeholder: |
        Device model:
        Android version:
        Launcher version:
        Game version or branch, if relevant:
        Mods enabled, if relevant:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots, if available
      description: Keep any diagnostics prefilled by the app. You can paste a reviewed log or attach a support report, screenshot, or recording. For a save-sync problem, include the action you chose and the result shown.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, tokens, private account details, and private saves from anything I am sharing.
          required: true
