name: Game download, update, or version problem
description: Report a failed download or update, a missing Steam branch, or the wrong game version.
title: "[BRANCH] "
labels: ["bug", "needs-triage", "category: reliability"]
body:
  - type: markdown
    attributes:
      value: |
        Include the version shown on the Versions page and the message you received. You do not need to find depot manifests, file hashes, or runtime IDs.

        You can attach a report from **Help → Diagnostics → Create support report**. Review it before sharing; remove passwords, Steam Guard codes, tokens, account details, and private saves.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the error message or describe how the downloaded game differed from the version you selected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Say whether you were downloading for the first time, updating, switching versions, or redownloading after a problem.
      placeholder: |
        1. Open Versions.
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device, launcher, and game version
      placeholder: |
        Device model:
        Android version:
        Launcher version:
        Game version or Steam branch selected:
        Version shown after download, if different:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Support report, logs, or screenshots, if available
      description: Attach a reviewed report or screenshot of the failure. For missing or mixed game content, name the affected screen or item. Unknown technical details can be left out.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, tokens, private account details, and private saves from anything I am sharing.
          required: true
