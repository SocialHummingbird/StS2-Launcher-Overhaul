name: Workshop mods or modded saves
description: Report mod downloads, loading, gameplay, or vanilla/modded save problems.
title: "[MODS] "
labels: ["bug", "needs-triage", "category: reliability"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which mods you enabled, what the launcher reported, and what happened in the game. A successful loading result does not prove that every mod feature works.

        Use **Help → Diagnostics → Create support report** if available. Review attachments before sharing; remove passwords, Steam Guard codes, tokens, account details, and private saves.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the missing feature, loading error, crash, or save problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Include the action that should show the mod's effect. If you already tried Vanilla, say what happened; you do not need to change a valuable save just to report a bug.
      placeholder: |
        1. Enable ...
        2. Press Play.
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device, launcher, and game version
      placeholder: |
        Device model:
        Android version:
        Launcher version:
        Game version or Steam branch:
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Enabled mods
      description: List names or Workshop links. Mention any manually installed packages and the status shown for each affected mod.
    validations:
      required: true
  - type: textarea
    id: save-behavior
    attributes:
      label: Save details, if relevant
      description: Say which save set the launcher displayed, whether the profile appeared, and whether it loaded. Do not attach private save files publicly.
  - type: textarea
    id: evidence
    attributes:
      label: Support report, logs, or screenshots, if available
      description: Attach a reviewed report and any screenshot or recording that shows the missing feature or error. Internal hashes and runtime IDs do not need to be copied into this form.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, tokens, private account details, and private saves from anything I am sharing.
          required: true
