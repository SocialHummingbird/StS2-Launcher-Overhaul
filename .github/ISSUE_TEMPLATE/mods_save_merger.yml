name: Mods, Workshop, or save compatibility
description: Report Workshop discovery, mod selection, mod loading, or native vanilla/modded save behavior.
title: "[MODS] "
labels: ["bug", "needs-triage", "category: reliability"]
body:
  - type: markdown
    attributes:
      value: |
        This is the preferred template for Workshop/mod reports. SavesMerger is deprecated in current source builds; report whether the game's native modded profile is visible without it.

        This is an unofficial community launcher. It is not affiliated with or endorsed by Mega Crit Games, Steam, or Valve, and it bundles no Slay the Spire 2 game files, assets, or Workshop content. Steam ownership is required.

  - type: dropdown
    id: test-type
    attributes:
      label: Test type
      multiple: true
      options:
        - Workshop sync/discovery
        - Manual import
        - Mod selector UI
        - Vanilla launch with mods disabled
        - Modded launch with selected mods
        - Deprecated SavesMerger was selected or loaded
        - Save compatibility
        - Mod crash or hang
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the mod loading or native save-compatibility result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include Workshop sync/manual import, mod selection, launch mode, save check, and whether mods were disabled afterward.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device, app, and branch context
      value: |
        Device model:
        Android version:
        Device ABI:
        APK release tag:
        APK filename:
        Package name:
        App version/versionCode:
        Selected game branch:
        Clean install or update install:
        Steam account owns Slay the Spire 2:
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods selected
      description: List every selected mod in launch order if known.
      value: |
        Mod name:
        Workshop item ID:
        Source, Workshop sync or manual import:
        Files present, for example .dll/.json/.pck:
        Enabled or disabled:
        Launcher showed unsupported/attention warning:

        Repeat for each mod:
    validations:
      required: true
  - type: textarea
    id: launcher-state
    attributes:
      label: Launcher mod state
      description: Paste visible status and diagnostics when available.
      value: |
        Mods section appeared on launcher screen:
        Workshop sync completed:
        Manual import used:
        Selected mod count:
        Active mod status text:
        Unsupported item warning text:
    validations:
      required: true
  - type: textarea
    id: save-behavior
    attributes:
      label: Save behavior
      description: Report whether native local modded saves were visible and loadable. Do not attach private save files publicly.
      value: |
        Existing vanilla save present before test:
        Existing modded save present before test:
        Save/profile became visible in-game:
        Save/profile loaded successfully:
        SavesMerger was absent from selected/activation evidence:
    validations:
      required: true
  - type: checkboxes
    id: result
    attributes:
      label: Result
      options:
        - label: Game reached main menu.
        - label: Game loaded selected mods.
        - label: Game launched vanilla with zero mods.
        - label: The native modded save was usable.
        - label: The native modded save was not usable.
        - label: App crashed or hung.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, and runtime evidence
      description: |
        Useful terms: Workshop, Mods, SavesMerger, BaseLib, Quick Restart, Loaded, PatchHelper, AndroidRuntime, FATAL EXCEPTION.
      value: |
        Focused logcat attached:
        Screenshots attached:
        Selected game branch:
        GameIdentity ID:
        Selected PCK SHA-256:
        Selected source sts2.dll SHA-256:
        Runtime pack ID:
        Runtime-pack sts2.dll SHA-256:
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I reviewed the report/logs and removed Steam credentials, Steam Guard codes, refresh/session tokens, private account details, private save contents, and full unsanitized logs.
          required: true
