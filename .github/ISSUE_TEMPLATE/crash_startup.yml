name: Crash, hang, or startup problem
description: Report a crash, black screen, loading hang, or Android diagnostics screen.
title: "[CRASH] "
labels: ["bug", "needs-triage", "category: reliability"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us the last screen you saw and whether the app closed or stopped responding. A diagnostics screen is useful evidence, even if the game never opened.

        If Help is available, use **Diagnostics → Create support report**. Startup controls may offer **Create Startup Help Report** instead. Attach a reviewed report below; you do not need to copy its internal fields. Do not share passwords, Steam Guard codes, tokens, account details, or private saves.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the last visible screen, any error message, and whether Android showed a crash or wait/close dialog.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Include anything relevant, such as pressing Play, enabling mods, switching apps, rotating, or locking the phone.
      placeholder: |
        1. Open the launcher.
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and launcher version
      placeholder: |
        Device model:
        Android version:
        Launcher version:
        Game version or branch:
        Vanilla or Modded, and selected mods:
    validations:
      required: true
  - type: textarea
    id: timing
    attributes:
      label: When does it happen?
      description: Approximate times are fine. Mention whether this was the first launch after installing or updating, and whether Safe Start or Vanilla behaves differently if you already tried them.
  - type: textarea
    id: logs
    attributes:
      label: Support report, logs, or screenshots, if available
      description: Attach a reviewed support report or a short recording. If you cannot collect evidence, submit the report with the details above.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, tokens, private account details, and private saves from anything I am sharing.
          required: true
