name: Android Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to use (optional, e.g. v0.2.1)."
        required: false
        default: ""
      upstream_release_tag:
        description: "Upstream release tag to source GodotSharp.dll when local artifacts are missing."
        required: false
        default: "0.2.0"
      upstream_release_apk_sha256:
        description: "Expected SHA-256 of the upstream release APK. Must be changed with upstream_release_tag."
        required: false
        default: "6dddbd6716c3830ec802e2672be2402bd06d4270dcf1bcd72c27e46ca05acf41"
      sts2_dll_source_url:
        description: "Pinned URL or repository path to a raw sts2.dll or source APK."
        required: false
        default: "https://github.com/SocialHummingbird/StS2-Launcher-Overhaul/releases/download/v0.2.416-startup-recovery-ime/StS2Launcher-v0.2.416-startup-recovery-ime-local-arm64-v8a.apk"
      sts2_dll_source_sha256:
        description: "Expected SHA-256 of sts2_dll_source_url. Must be changed with the source."
        required: false
        default: "fdf2dcfcf2352d0e1a370da76922fb5b70cee3654d98c5fe9afbbd39554fc17b"
      version_name:
        description: "Override APK version name (optional)."
        required: false
        default: ""
      version_code:
        description: "APK version code. Must be greater than the pinned v0.2.416 .local baseline (416001)."
        required: true
        default: "417003"
permissions:
  contents: read

jobs:
  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      package_name: ${{ steps.version.outputs.package_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_path: ${{ steps.build.outputs.path }}
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve release metadata
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: "${{ github.event.inputs.release_tag }}"
          VERSION_NAME_INPUT: "${{ github.event.inputs.version_name }}"
          VERSION_CODE_INPUT: "${{ github.event.inputs.version_code }}"
        run: |
          set -euo pipefail

          RELEASE_TAG="${RELEASE_TAG_INPUT}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="nightly-${GITHUB_SHA:0:7}"
          fi

          VERSION_NAME="${VERSION_NAME_INPUT}"
          if [[ -z "${VERSION_NAME}" ]]; then
            VERSION_NAME="${RELEASE_TAG#v}"
          fi

          PACKAGE_NAME="com.sts2launcher.overhaul.fork.local"

          VERSION_CODE="${VERSION_CODE_INPUT}"
          if ! [[ "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must be an explicit positive integer."
            exit 1
          fi
          if (( VERSION_CODE <= 416001 )); then
            echo "::error::version_code must exceed the pinned v0.2.416 .local baseline versionCode 416001."
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check Android build prerequisites
        id: prerequisites
        shell: bash
        env:
          UPSTREAM_TAG_INPUT: "${{ github.event.inputs.upstream_release_tag }}"
          UPSTREAM_APK_SHA256_INPUT: "${{ github.event.inputs.upstream_release_apk_sha256 }}"
          STS2_SOURCE_INPUT: "${{ github.event.inputs.sts2_dll_source_url }}"
          STS2_SOURCE_SHA256_INPUT: "${{ github.event.inputs.sts2_dll_source_sha256 }}"
        run: |
          set -euo pipefail
          PUBLISH_DIR="upstream/godot-export/.godot/mono/publish/arm64"
          mkdir -p "$PUBLISH_DIR"
          REQUIRED_DLLS=(
            "0Harmony.dll"
            "GodotSharp.dll"
            "sts2.dll"
          )
          MISSING_DLLS=()

          for dll in "${REQUIRED_DLLS[@]}"; do
            if [[ ! -f "$PUBLISH_DIR/$dll" ]]; then
              MISSING_DLLS+=("$dll")
            fi
          done

          if (( ${#MISSING_DLLS[@]} == 0 )); then
            echo "Found local publish dependencies in ${PUBLISH_DIR}; still staging upstream Mono Android runtime."
          else
            echo "::warning::Missing publish dependencies: ${MISSING_DLLS[*]}. Attempting to source from upstream release."
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG_INPUT}"
          if [[ -z "${UPSTREAM_TAG}" ]]; then
            UPSTREAM_TAG="0.2.0"
          fi
          UPSTREAM_APK_SHA256="${UPSTREAM_APK_SHA256_INPUT}"
          if ! [[ "${UPSTREAM_APK_SHA256}" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::upstream_release_apk_sha256 must be the expected 64-character SHA-256 for upstream release ${UPSTREAM_TAG}."
            exit 1
          fi
          UPSTREAM_APK="StS2Launcher-v${UPSTREAM_TAG}.apk"
          UPSTREAM_URL="https://github.com/Ekyso/StS2-Launcher/releases/download/${UPSTREAM_TAG}/${UPSTREAM_APK}"
          TMP_DIR="$(mktemp -d)"
          TMP_APK="$TMP_DIR/$UPSTREAM_APK"

          if command -v curl >/dev/null 2>&1; then
            curl -fsSL -o "$TMP_APK" "$UPSTREAM_URL"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO "$TMP_APK" "$UPSTREAM_URL"
          else
            echo "::error::Neither curl nor wget available to fetch upstream APK fallback."
            exit 1
          fi

          if [[ ! -f "$TMP_APK" ]]; then
            echo "::error::Failed to download upstream APK from $UPSTREAM_URL"
            exit 1
          fi
          ACTUAL_UPSTREAM_APK_SHA256="$(sha256sum "$TMP_APK" | awk '{print $1}')"
          if [[ "${ACTUAL_UPSTREAM_APK_SHA256,,}" != "${UPSTREAM_APK_SHA256,,}" ]]; then
            echo "::error::Upstream APK SHA-256 mismatch for ${UPSTREAM_URL}. Expected ${UPSTREAM_APK_SHA256}, got ${ACTUAL_UPSTREAM_APK_SHA256}. If upstream_release_tag was overridden, provide its matching upstream_release_apk_sha256."
            exit 1
          fi

          echo "Staging upstream Mono native runtime and base class libraries."
          mkdir -p android/libs/release/arm64-v8a android/assets/dotnet_bcl
          unzip -jo "$TMP_APK" 'lib/arm64-v8a/*.so' -d android/libs/release/arm64-v8a
          unzip -jo "$TMP_APK" 'assets/dotnet_bcl/*.dll' -d android/assets/dotnet_bcl

          STS2_SOURCE="${STS2_SOURCE_INPUT}"
          STS2_SOURCE_SHA256="${STS2_SOURCE_SHA256_INPUT}"

            if [[ " ${MISSING_DLLS[*]} " == *" sts2.dll "* ]]; then
              if [[ -z "${STS2_SOURCE}" ]]; then
                echo "::error::sts2_dll_source_url is required when the checked-out publish inputs do not contain sts2.dll."
                exit 1
              fi
              if ! [[ "${STS2_SOURCE_SHA256}" =~ ^[A-Fa-f0-9]{64}$ ]]; then
                echo "::error::sts2_dll_source_sha256 must be the expected 64-character SHA-256 for sts2_dll_source_url."
                exit 1
              fi

              STS2_SOURCE_FILE="$TMP_DIR/sts2-source"
              if [[ "${STS2_SOURCE}" == http* ]]; then
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL -o "$STS2_SOURCE_FILE" "$STS2_SOURCE"
                elif command -v wget >/dev/null 2>&1; then
                  wget -qO "$STS2_SOURCE_FILE" "$STS2_SOURCE"
                else
                  echo "::error::Neither curl nor wget available to fetch sts2.dll source."
                  exit 1
                fi
              elif [[ -f "${STS2_SOURCE}" ]]; then
                cp "${STS2_SOURCE}" "$STS2_SOURCE_FILE"
              else
                echo "::error::sts2_dll_source_url must be a downloadable URL or readable repository path."
                exit 1
              fi

              ACTUAL_STS2_SOURCE_SHA256="$(sha256sum "$STS2_SOURCE_FILE" | awk '{print $1}')"
              if [[ "${ACTUAL_STS2_SOURCE_SHA256,,}" != "${STS2_SOURCE_SHA256,,}" ]]; then
                echo "::error::sts2.dll source SHA-256 mismatch for ${STS2_SOURCE}. Expected ${STS2_SOURCE_SHA256}, got ${ACTUAL_STS2_SOURCE_SHA256}. If sts2_dll_source_url was overridden, provide its matching sts2_dll_source_sha256."
                exit 1
              fi

              if [[ "${STS2_SOURCE%%\?*}" == *.apk ]]; then
                echo "Extracting sts2.dll from the verified source APK."
                if ! unzip -p "$STS2_SOURCE_FILE" 'assets/dotnet_bcl/sts2.dll' > "$PUBLISH_DIR/sts2.dll"; then
                  echo "::error::Verified source APK does not contain assets/dotnet_bcl/sts2.dll."
                  exit 1
                fi
              else
                cp "$STS2_SOURCE_FILE" "$PUBLISH_DIR/sts2.dll"
              fi

            for i in "${!MISSING_DLLS[@]}"; do
              if [[ "${MISSING_DLLS[i]}" == "sts2.dll" ]]; then
                unset "MISSING_DLLS[i]"
              fi
            done
            MISSING_DLLS=("${MISSING_DLLS[@]}")
          fi

          if (( ${#MISSING_DLLS[@]} > 0 )); then
            for dll in "${MISSING_DLLS[@]}"; do
              source="assets/dotnet_bcl/$dll"
              if ! unzip -l "$TMP_APK" "$source" > /dev/null; then
                echo "::error::Expected ${source} not present in upstream APK."
                exit 1
              fi
              unzip -p "$TMP_APK" "$source" > "$PUBLISH_DIR/$dll"
            done
          fi

          echo "Recovered missing publish dependencies from upstream release: ${MISSING_DLLS[*]}"

      - name: Verify save safety before building candidate
        shell: pwsh
        run: |
          ./scripts/test-local-gameplay-save-safety.ps1
          ./scripts/test-cloud-sync-production-path.ps1
          ./scripts/test-local-save-recovery-production-path.ps1
          ./scripts/test-legacy-save-recovery-scanner.ps1
          ./scripts/test-no-vanilla-to-modded-seeding.ps1
          ./scripts/audit-cloud-sync-production-path-nonmutation.ps1
          ./scripts/test-stage5-save-evidence-manifests.ps1
          ./scripts/test-stage5-physical-matrix-reviewer.ps1

      - name: Build patched Godot Android runtime
        shell: bash
        env:
          ARCHES: arm64
        run: |
          set -euo pipefail
          scripts/setup-godot-source.sh
          scripts/build-godot.sh

      - name: Generate launcher bootstrap PCK
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/make-bootstrap-pck.py
          if [[ ! -f android/assets/bootstrap.pck ]]; then
            echo "::error::bootstrap.pck generation failed."
            exit 1
          fi

      - name: Build patcher and stage Android assets
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          ROOT_DIR="$(pwd)"
          PATCHER_DIR="$ROOT_DIR/src/STS2Mobile"
          BUILD_DIR="$ROOT_DIR/android"
          PUBLISH_DIR="$PATCHER_DIR/bin/Release/net9.0/publish"
          BCL_DIR="$BUILD_DIR/assets/dotnet_bcl"
          UPSTREAM_DIR="$ROOT_DIR/upstream/godot-export/.godot/mono/publish/arm64"

          cd "$PATCHER_DIR"
          dotnet publish -c Release

          mkdir -p "$BCL_DIR"
          copy_dependency() {
            local src_name="$1"
            if [[ -f "$PUBLISH_DIR/$src_name" ]]; then
              cp "$PUBLISH_DIR/$src_name" "$BCL_DIR/$src_name"
            elif [[ -f "$UPSTREAM_DIR/$src_name" ]]; then
              cp "$UPSTREAM_DIR/$src_name" "$BCL_DIR/$src_name"
            else
              echo "::error::Required dependency not found: $src_name"
              exit 1
            fi
          }

          cp "$PUBLISH_DIR"/STS2Mobile.dll "$PUBLISH_DIR"/SteamKit2.dll \
             "$PUBLISH_DIR"/protobuf-net.dll "$PUBLISH_DIR"/protobuf-net.Core.dll \
             "$PUBLISH_DIR"/System.IO.Hashing.dll "$PUBLISH_DIR"/ZstdSharp.dll \
             "$BCL_DIR/"
          copy_dependency 0Harmony.dll
          copy_dependency sts2.dll
          copy_dependency GodotSharp.dll

          if [[ ! -f "$BCL_DIR/Sentry.dll" ]]; then
            echo "Staging Sentry.dll required by sts2.dll metadata."
            SENTRY_VERSION="5.0.0"
            SENTRY_PACKAGE="$RUNNER_TEMP/sentry.${SENTRY_VERSION}.nupkg"
            SENTRY_URL="https://api.nuget.org/v3-flatcontainer/sentry/${SENTRY_VERSION}/sentry.${SENTRY_VERSION}.nupkg"
            curl -fsSL -o "$SENTRY_PACKAGE" "$SENTRY_URL"
            if ! unzip -p "$SENTRY_PACKAGE" 'lib/netstandard2.0/Sentry.dll' > "$BCL_DIR/Sentry.dll"; then
              echo "::error::Downloaded Sentry ${SENTRY_VERSION}, but lib/netstandard2.0/Sentry.dll was not found."
              exit 1
            fi
          fi

          echo "Patching SteamKit2 Android crypto calls."
          dotnet build "$ROOT_DIR/tools/SteamKitAndroidPatch/SteamKitAndroidPatch.csproj" -c Release
          patch_output_file="$RUNNER_TEMP/steamkit-android-patch-output.txt"
          if ! dotnet "$ROOT_DIR/tools/SteamKitAndroidPatch/bin/Release/net9.0/SteamKitAndroidPatch.dll" \
            "$BCL_DIR/SteamKit2.dll" \
            "$BCL_DIR/STS2Mobile.dll" \
            "$BCL_DIR/sts2.dll" > "$patch_output_file" 2>&1; then
            cat "$patch_output_file"
            echo "::error::SteamKit Android patcher failed."
            exit 1
          fi
          cat "$patch_output_file"
          if ! grep -Eq 'Patched System\.Net\.WebSockets\.Client\.dll: sha1TryHashData=[1-9][0-9]*' "$patch_output_file"; then
            echo "::error::System.Net.WebSockets.Client.dll SHA1 patch summary was not emitted with a positive patch count."
            exit 1
          fi

          resolve_tls_so() {
            local runtime_version
            runtime_version="$(dotnet --list-runtimes | awk '/^Microsoft.NETCore.App / {print $2; exit}')"
            if [[ -z "${runtime_version}" ]]; then
              echo "::warning::Unable to detect Microsoft.NETCore.App runtime version."
              return 1
            fi

            local packaged_dir="$HOME/.nuget/packages/microsoft.netcore.app.runtime.mono.android-arm64/${runtime_version}"
            local local_so="$(find "$packaged_dir" -path '*/runtimes/android-arm64/native/libSystem.Security.Cryptography.Native.Android.so' 2>/dev/null | head -n 1 || true)"
            if [[ -n "${local_so}" ]]; then
              cp "${local_so}" "$BUILD_DIR/libs/release/arm64-v8a/"
              return 0
            fi

            local pkg_name="microsoft.netcore.app.runtime.mono.android-arm64"
            local pkg_file="$RUNNER_TEMP/${pkg_name}.${runtime_version}.nupkg"
            local pkg_url="https://api.nuget.org/v3-flatcontainer/${pkg_name}/${runtime_version}/${pkg_name}.${runtime_version}.nupkg"
            if ! curl -fsSL -o "$pkg_file" "$pkg_url"; then
              echo "::warning::Failed to download ${pkg_name} ${runtime_version} from NuGet."
              return 1
            fi

            local extract_dir="$RUNNER_TEMP/${pkg_name}_extract"
            mkdir -p "$extract_dir"
            if ! unzip -q "$pkg_file" -d "$extract_dir"; then
              echo "::warning::Failed to extract ${pkg_name} ${runtime_version} archive."
              return 1
            fi

            local downloaded_so="$(find "$extract_dir" -path '*/runtimes/android-arm64/native/libSystem.Security.Cryptography.Native.Android.so' 2>/dev/null | head -n 1 || true)"
            if [[ -z "${downloaded_so}" ]]; then
              echo "::warning::Downloaded ${pkg_name} ${runtime_version} but native TLS .so is missing."
              return 1
            fi

            cp "${downloaded_so}" "$BUILD_DIR/libs/release/arm64-v8a/"
          }

          mkdir -p "$BUILD_DIR/libs/release/arm64-v8a"
          if ! resolve_tls_so; then
            echo "::warning::TLS library libSystem.Security.Cryptography.Native.Android.so could not be resolved; proceeding without explicit native TLS copy."
          fi

      - name: Configure v0.2.416 local-line signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: "${{ secrets.ANDROID_LOCAL_UPDATE_KEYSTORE_BASE64 }}"
          KEYSTORE_PASSWORD: "${{ secrets.ANDROID_LOCAL_UPDATE_KEYSTORE_PASSWORD }}"
          KEYSTORE_ALIAS: "${{ secrets.ANDROID_LOCAL_UPDATE_KEY_ALIAS }}"
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEYSTORE_ALIAS}" ]]; then
            mkdir -p "$RUNNER_TEMP/android-signing"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/android-signing/sts2.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/android-signing/sts2.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Dedicated v0.2.416 local-update signing secrets are not configured. Refusing to build a candidate that cannot update the published install."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK
        id: build
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          EXPORT_PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KEYSTORE_PASSWORD: "${{ secrets.ANDROID_LOCAL_UPDATE_KEYSTORE_PASSWORD }}"
          KEYSTORE_ALIAS: "${{ secrets.ANDROID_LOCAL_UPDATE_KEY_ALIAS }}"
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_LOCAL_UPDATE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail

          cd android
          GRADLE_ARGS=(
            "assembleMonoRelease"
            "-Pexport_version_name=${VERSION_NAME}"
            "-Pexport_version_code=${VERSION_CODE}"
            "-Pexport_build_type=release"
            "-Pexport_edition=mono"
            "-Pexport_package_name=${EXPORT_PACKAGE_NAME}"
            "-Pexport_enabled_abis=arm64-v8a"
          )

          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            GRADLE_ARGS+=(
              "-Pperform_signing=true"
              "-Prelease_keystore_file=${KEYSTORE_PATH}"
              "-Prelease_keystore_password=${KEYSTORE_PASSWORD}"
              "-Prelease_keystore_alias=${KEYSTORE_ALIAS}"
            )
          else
            GRADLE_ARGS+=("-Pperform_signing=false")
          fi

          gradle "${GRADLE_ARGS[@]}"

          RAW_APK_PATH="$(find build/outputs/apk/mono/release -type f -name "StS2Launcher-v${VERSION_NAME}*.apk" | head -n 1)"
          if [[ -z "${RAW_APK_PATH}" ]] || [[ ! -f "${RAW_APK_PATH}" ]]; then
            echo "Files in build/outputs/apk/mono/release:"
            find build/outputs/apk/mono/release -type f
            echo "::error::Expected APK not found at ${RAW_APK_PATH}"
            exit 1
          fi
          ABS_APK_PATH="$(pwd)/${RAW_APK_PATH}"
          RENAMED_APK_PATH="$(dirname "${RAW_APK_PATH}")/StS2Launcher-v${VERSION_NAME}-arm64-v8a.apk"
          mv "$RAW_APK_PATH" "$RENAMED_APK_PATH"
          APK_PATH="android/${RENAMED_APK_PATH}"
          ABS_APK_PATH="$(pwd)/${RENAMED_APK_PATH}"

          pwsh ../scripts/verify-android-apk.ps1 -ApkPath "$ABS_APK_PATH" -Abi arm64-v8a

          APK_IDENTITY="$(
            APK_TO_INSPECT="$ABS_APK_PATH" pwsh -NoProfile -NonInteractive -Command \
              '. (Join-Path $env:GITHUB_WORKSPACE "scripts/android-signing-utils.ps1"); $identity = Get-AndroidApkIdentity -Path $env:APK_TO_INSPECT; "{0}`t{1}" -f $identity.packageName, $identity.signerSha256'
          )"
          IFS=$'\t' read -r ACTUAL_PACKAGE_NAME ACTUAL_SIGNER_SHA256 <<< "$APK_IDENTITY"
          EXPECTED_SIGNER_NORMALIZED="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_PACKAGE_NAME" != "$EXPORT_PACKAGE_NAME" ]]; then
            echo "::error::Built APK package mismatch. Expected ${EXPORT_PACKAGE_NAME}, got ${ACTUAL_PACKAGE_NAME}."
            exit 1
          fi
          if ! [[ "$EXPECTED_SIGNER_NORMALIZED" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::Repository variable ANDROID_LOCAL_UPDATE_SIGNER_SHA256 is missing or invalid."
            exit 1
          fi
          if [[ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_NORMALIZED" ]]; then
            echo "::error::Built APK signer mismatch. Expected ${EXPECTED_SIGNER_NORMALIZED}, got ${ACTUAL_SIGNER_SHA256}."
            exit 1
          fi

          APK_SHA="$(sha256sum "$ABS_APK_PATH" | awk '{print $1}')"

          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "package_name=${ACTUAL_PACKAGE_NAME}"
            echo "abi=arm64-v8a"
            echo "signing_channel=release"
            echo "signer_sha256=${ACTUAL_SIGNER_SHA256}"
            echo "release_tag=${RELEASE_TAG}"
            echo "source_commit=${GITHUB_SHA}"
            echo "candidate_run_id=${GITHUB_RUN_ID}"
            echo "candidate_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "apk_sha256=${APK_SHA}"
          } > "${ABS_APK_PATH}.build-info.txt"

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$APK_SHA" "$(basename "$ABS_APK_PATH")" > "${ABS_APK_PATH}.sha256"

      - name: Verify release update compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_APK_PATH: ${{ steps.build.outputs.path }}
          EXPECTED_PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_LOCAL_UPDATE_SIGNER_SHA256 }}
          UPDATE_BASELINE_TAG: v0.2.416-startup-recovery-ime
          UPDATE_BASELINE_ASSET_NAME: StS2Launcher-v0.2.416-startup-recovery-ime-local-arm64-v8a.apk
          UPDATE_BASELINE_APK_SHA256: fdf2dcfcf2352d0e1a370da76922fb5b70cee3654d98c5fe9afbbd39554fc17b
        run: |
          set -euo pipefail

          PREVIOUS_DIR="$RUNNER_TEMP/previous-android-release"
          mkdir -p "$PREVIOUS_DIR"

          if [[ -z "${EXPECTED_SIGNER_SHA256}" ]]; then
            echo "::error::Repository variable ANDROID_LOCAL_UPDATE_SIGNER_SHA256 is not configured. Refusing to retain an unpinned candidate."
            exit 1
          fi

          if [[ -z "${UPDATE_BASELINE_TAG}" ]]; then
            echo "::error::update_baseline_tag is required. The workflow never guesses a baseline from the latest APK release."
            exit 1
          fi
          if [[ -z "${UPDATE_BASELINE_ASSET_NAME}" ]]; then
            echo "::error::update_baseline_asset_name is required with update_baseline_tag."
            exit 1
          fi
          if ! [[ "${UPDATE_BASELINE_APK_SHA256}" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::update_baseline_apk_sha256 must be the expected 64-character SHA-256 for the selected baseline APK."
            exit 1
          fi

          echo "Checking update compatibility against ${UPDATE_BASELINE_TAG}/${UPDATE_BASELINE_ASSET_NAME}"
          gh release download "$UPDATE_BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$UPDATE_BASELINE_ASSET_NAME" \
            --dir "$PREVIOUS_DIR" \
            --clobber

          PREVIOUS_APK_PATH="$PREVIOUS_DIR/$UPDATE_BASELINE_ASSET_NAME"
          if [[ ! -f "$PREVIOUS_APK_PATH" ]]; then
            echo "::error::Selected update-baseline APK was not downloaded: ${UPDATE_BASELINE_TAG}/${UPDATE_BASELINE_ASSET_NAME}"
            exit 1
          fi
          ACTUAL_BASELINE_APK_SHA256="$(sha256sum "$PREVIOUS_APK_PATH" | awk '{print $1}')"
          if [[ "${ACTUAL_BASELINE_APK_SHA256,,}" != "${UPDATE_BASELINE_APK_SHA256,,}" ]]; then
            echo "::error::Update-baseline APK SHA-256 mismatch. Expected ${UPDATE_BASELINE_APK_SHA256}, got ${ACTUAL_BASELINE_APK_SHA256}. If the baseline was overridden, provide its matching update_baseline_apk_sha256."
            exit 1
          fi

          pwsh scripts/verify-android-update-compat.ps1 \
            -ApkPath "$CURRENT_APK_PATH" \
            -PreviousApkPath "$PREVIOUS_APK_PATH" \
            -ExpectedPackageName "$EXPECTED_PACKAGE_NAME" \
            -ExpectedSignerSha256 "$EXPECTED_SIGNER_SHA256"

          {
            echo "update_baseline_tag=${UPDATE_BASELINE_TAG}"
            echo "update_baseline_asset_name=${UPDATE_BASELINE_ASSET_NAME}"
            echo "update_baseline_apk_sha256=${ACTUAL_BASELINE_APK_SHA256}"
          } >> "${CURRENT_APK_PATH}.build-info.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.release_tag }}
          path: |
            ${{ steps.build.outputs.path }}
            ${{ steps.build.outputs.path }}.sha256
            ${{ steps.build.outputs.path }}.build-info.txt
          if-no-files-found: error
          retention-days: 30
